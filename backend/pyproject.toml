[project]
name = "amazon-collector-backend"
version = "1.0.0"
description = "Amazon 商品数据采集后端"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "curl_cffi>=0.7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*", "db*", "repositories*", "services*", "integrations*"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
